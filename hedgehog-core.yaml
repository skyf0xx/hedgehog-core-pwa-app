name: pwa-app
flag: --pwa-app
language: typescript
engine: "^5.0.0"
selects_when: >
  The description names an app whose data model fits on the user's
  device and whose reads and writes are the user's own — a tracker,
  journal, notebook, planner, offline reference, or utility. Offline
  capability or installability named explicitly is a strong signal.
  Sharing, collaboration, accounts, and multi-device sync do NOT
  disqualify a project: Dexie Cloud provides sync, authentication, and
  server-enforced per-object access control, so a shared list, a family
  calendar, or a small team's board is still this core. A small number
  of entities that must be server-authoritative do NOT disqualify a
  project either: those entities are declared --remote and backed by
  Supabase behind the same repository interface, while the rest of the
  app stays local-first. What routes a project to full-stack-app is
  server-side logic across most of the app, not the presence of one or
  two such entities.
workspace: workspace/
template: CLAUDE.core.md
agents: [pwa-eng]
skills: [hedgehog-loop, hedgehog-bootstrap-pwa-app-core]
