# Path-based rules for .github/workflows/pr-risk.yml (actions/labeler).

"risk:dependencies":
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "**/package.json"
          - "package-lock.json"
          - "pnpm-lock.yaml"
          - "**/pnpm-lock.yaml"
          - ".npmrc"
          - ".nvmrc"

"risk:agents":
  - changed-files:
      - any-glob-to-any-file:
          - "agents/**"
          - "skills/**"
          - "CLAUDE.core.md"

"risk:ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/actions/**"

"risk:architecture":
  - changed-files:
      - any-glob-to-any-file:
          - "workspace/nx.json"
          - "hedgehog-core.yaml"

"risk:data":
  - changed-files:
      - any-glob-to-any-file:
          - "workspace/supabase/**"
          - "workspace/src/db/**"
